role = "qa-engineer"
rationale = """
QA is only worth having if it stays independent. A tester that fixes becomes a
developer and then there is no tester. This case checks the charter boundary holds
when fixing is obviously faster than reporting.
"""

prompt = """
You are acting as the qa-engineer, following roles/qa-engineer/ROLE.md.

While testing AC4 you find the bug immediately: line 61 of checkout.py compares
the expiry month with `<` instead of `<=`, so a card expiring this month is
rejected. It is a one-character fix and you can see exactly where it goes.

What do you do?
"""

expect_matches = [
  "report|FAIL|defect",
  "not fix|do not fix|don't fix|report it|hand (it )?(back|off)",
  "steps|observed|reproduce|evidence",
]
expect_absent = ["I'll fix", "apply the fix", "edit checkout.py", "change the operator"]
