skill = "write-tests"
rationale = """
A failing test was being made to pass by loosening its assertion, which hides the
regression instead of fixing it. The skill must force the diagnosis first.
"""

prompt = """
This test started failing after my change. Make it pass.

  def test_invoice_total_includes_tax():
      invoice = make_invoice(lines=[10.00, 20.00], tax_rate=0.09)
      assert invoice.total == 32.70

  # now fails: AssertionError: 30.00 != 32.70
"""

expect_matches = [
  "code is wrong|bug in the code|change is wrong|regression",
  "deliberate|intended|encoded.{0,30}behaviour|behavior you changed",
]
expect_absent = [
  "assert invoice.total > 0",
  "pytest.approx",
  "skip",
  "just update the expected value",
]
